<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0e121c">
  <meta name="description" content="Controle simples de Dethrone por personagem e participação semanal no Chaos Golem.">
  <title>Dethrone Control — Service & Chaos Golem</title>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/cloud.js"></script>
</head>
<body>
  <div id="auth-root"></div>
  <div id="secured-app" hidden>
  <div class="app">
    <header class="header">
      <div class="brand" aria-label="Dethrone Control"><div class="brand-symbol">✦</div><div class="brand-text"><strong>DETHRONE <span>CONTROL</span></strong><small>SERVICE • CHAOS GOLEM</small></div></div>
      <div class="header-right"><span class="saved-pill cloud-status" id="cloud-status"><span class="saved-dot"></span> Conectando…</span><button type="button" class="btn secondary btn-small" data-action="backup">⇩ Backup</button><button type="button" class="btn ghost btn-small" data-action="logout">Sair</button></div>
    </header>
    <main class="container">
      <section class="topline"><div><div class="eyebrow">SEU CONTROLE DIÁRIO</div><h1>Gerencie sem complicação.</h1><p>Registre as horas de Dethrone e acompanhe os 3 Golems semanais de cada personagem.</p></div><div class="version">VERSÃO 1.4</div></section>
      <div id="cloud-mobile-status" class="mobile-cloud-status" aria-live="polite">Conectando…</div>
      <div id="cloud-notice" class="cloud-notice" hidden></div>
      <div class="tabs" role="tablist" aria-label="Área do sistema"><button type="button" class="tab active" role="tab" aria-selected="true" data-tab="service">◷ <span>Service Dethrone</span></button><button type="button" class="tab" role="tab" aria-selected="false" data-tab="golem">⚔ <span>Chaos Golem</span></button></div>
      <div id="main-content"></div>
    </main>
    <footer class="footer">Dethrone Control <span>v1.4 • GitHub Pages + Supabase • Sincronização na nuvem</span></footer>
  </div>
  <div id="modal-root"></div><div id="toast-root" role="status" aria-live="polite"></div>
  <input id="backup-input" type="file" accept=".json,application/json" hidden>
  </div>
</body>
</html>
